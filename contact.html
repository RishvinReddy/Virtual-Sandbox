    <!-- JSON-LD Structured Data (Contact Page Context) -->
    <script type="application/ld+json">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    
    <style>
        body, html {
            margin: 0; padding: 0;
            background: var(--bg-primary, #FAFBFF);
            color: var(--text-primary, #0A0E28);
            font-family: var(--font-body, 'Inter', sans-serif);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .contact-gateway {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .gateway-ring {
            width: 80px;
            height: 80px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .gateway-ring::before, .gateway-ring::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent-blue, #2563EB);
            border-bottom-color: var(--accent-violet, #7C3AED);
            animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        
        .gateway-ring::after {
            inset: 8px;
            border-top-color: transparent;
            border-bottom-color: transparent;
            border-left-color: var(--accent-blue, #2563EB);
            animation: spin-reverse 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .gateway-text {
            font-family: var(--font-mono, 'JetBrains Mono', monospace);
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #2563EB, #7C3AED);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse-opacity 2s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
            to { transform: rotate(-360deg); }
        }
        @keyframes pulse-opacity {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="contact-gateway">
        <div class="gateway-ring"></div>
        <div class="gateway-text">Routing to secure portal</div>
    </div>

    <script>
        // Smoothly redirect to the contact section after 1.2s to show off the cool animation
        setTimeout(() => {
            window.location.replace('services.html#contact');
        }, 1200);
    </script>
</body>
